<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusTrip — My Trips</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="app">
  <div class="topbar">
    <button class="icon-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
    <h1>My Trips</h1>
    <div class="spacer"></div>
    <button class="icon-btn" id="logoutBtn" title="Log out"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>

  <div class="screen">
    <div class="section-label">Your Trips</div>
    <div id="tripsList">
      <div class="loading-screen"><div class="spinner dark"></div></div>
    </div>
  </div>

  <button class="fab" id="fabBtn"><i class="fa-solid fa-plus"></i></button>

  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet">
      <h4>What would you like to do?</h4>
      <button class="sheet-option" onclick="window.location.href='create-trip.html'">
        <span class="fi"><i class="fa-solid fa-plus"></i></span> Create Trip
      </button>
      <button class="sheet-option" onclick="window.location.href='join-trip.html'">
        <span class="fi"><i class="fa-solid fa-users"></i></span> Join Trip
      </button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/home.js"></script>
</body>
</html>
