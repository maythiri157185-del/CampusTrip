<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusTrip — Join Trip</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="app">
  <div class="topbar">
    <button class="icon-btn" onclick="window.location.href='home.html'"><i class="fa-solid fa-arrow-left"></i></button>
    <h1>Join Trip</h1>
  </div>

  <div class="screen centered">
    <div class="centered-text">
      <div class="icon-circle"><i class="fa-solid fa-user-group"></i></div>
      <h2>Join a Trip</h2>
      <p>Enter the trip code provided by the organizer.</p>
    </div>

    <form id="joinTripForm" novalidate>
      <div class="field">
        <span class="fi"><i class="fa-solid fa-hashtag"></i></span>
        <input type="text" id="tripCode" placeholder="Enter Trip Code" style="text-transform:uppercase;letter-spacing:2px;" maxlength="10" required>
      </div>
      <div id="joinTripError" class="field-error hidden"></div>

      <button type="submit" class="btn btn-primary" id="joinTripBtn">Join</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/join-trip.js"></script>
</body>
</html>
