<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1e4d">
<link rel="apple-touch-icon" href="assets/icon-192.png">

  <title>CampusTrip — Welcome</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  .splash-screen { flex-direction: column; padding: 40px 28px; }
  .splash-loading .spinner { margin: 22px auto 0; }
  .splash-actions {
    width: 100%;
    max-width: 320px;
    margin: 34px auto 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: splashFadeIn 0.5s ease;
  }
  .splash-actions .btn-light {
    background: #fff;
    color: var(--navy-800);
  }
  .splash-actions .btn-outline-light {
    background: transparent;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.5);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="app">
  <div class="splash-screen">
    <div class="splash-content">
      <div class="splash-logo"><img src="assets/logo.png" alt="CampusTrip"></div>
      <h1>CampusTrip</h1>
      <p>Plan trips with your friends, together.</p>
    </div>

    <div class="splash-loading" id="splashLoading">
      <div class="spinner"></div>
    </div>

    <div class="splash-actions hidden" id="splashActions">
      <a class="btn btn-light" href="login.html">Log In</a>
      <a class="btn btn-outline-light" href="signup.html">Sign Up</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  // If someone is already signed in, skip straight to their trips.
  // Otherwise show a brief splash animation, then reveal Log In / Sign Up.
  let decided = false;

  function reveal() {
    if (decided) return;
    decided = true;
    document.getElementById("splashLoading").classList.add("hidden");
    document.getElementById("splashActions").classList.remove("hidden");
  }

  auth.onAuthStateChanged((user) => {
    if (user) {
      decided = true;
      window.location.href = "home.html";
    } else {
      reveal();
    }
  });

  // Fallback: never leave the user staring at a spinner for more than a moment.
  setTimeout(reveal, 1200);
</script>
<script src="js/pwa.js"></script>
</body>
</html>
